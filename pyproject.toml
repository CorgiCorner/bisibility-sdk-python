[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bisibility"
version = "0.5.0"
description = "Python client for the Bisibility API - SEO rank tracking, keywords, and ranking history."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Bisibility" }]
keywords = [
  "api-client",
  "bisibility",
  "python",
  "rank-tracker",
  "rank-tracking",
  "sdk",
  "seo",
  "seo-tools",
  "serp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "hatchling>=1.25",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://bisibility.com"
Documentation = "https://bisibility.com/docs/api"
Source = "https://github.com/CorgiCorner/bisibility-sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["src/bisibility"]

[tool.hatch.build.targets.sdist]
include = ["src/bisibility", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bisibility --cov-fail-under=80 --cov-report=term-missing --cov-report=xml:coverage.xml -m \"not integration\""
markers = [
  "integration: tests that require a live Bisibility API server",
]

[tool.coverage.run]
source = ["bisibility"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
show_error_codes = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pydantic.*"]
follow_untyped_imports = true
