name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*-rc.*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.repository != 'CorgiCorner/bisibility-sdk-python' || github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ github.repository != 'CorgiCorner/bisibility-sdk-python' && vars.CI_USE_DEPOT == 'true' && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.10", "3.13"]') || fromJSON('["3.10", "3.11", "3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --no-build --no-install-project
          # Build only the checked-out SDK with the already locked build backend.
          uv sync --locked --extra dev --no-build-isolation --no-editable
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Mypy
        run: uv run --no-sync mypy
      - name: Pytest
        run: uv run --no-sync pytest
