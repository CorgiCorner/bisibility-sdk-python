name: Publish PyPI

on:
  push:
    tags:
      - "v*.*.*"
  # Manual recovery path. An atomic branch-plus-tag push into the mirror occasionally does not
  # emit a tag push event, leaving the tag present and this workflow never triggered. Re-run it
  # by dispatching against the release TAG; the version check below rejects any other ref.
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    name: Publish trusted package
    if: >-
      github.repository == 'CorgiCorner/bisibility-sdk-python' &&
      vars.PYPI_TRUSTED_PUBLISHING_ENABLED == 'true' &&
      startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc.')
    runs-on: ${{ github.repository != 'CorgiCorner/bisibility-sdk-python' && vars.CI_USE_DEPOT == 'true' && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: pypi

    steps:
      - name: Checkout public release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Verify signed stable tag and current native candidate CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/verify_release_publication.py

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.1"

      - name: Install locked dependencies
        run: |
          uv sync --locked --extra dev --no-build --no-install-project
          # Build only the checked-out SDK with the already locked build backend.
          uv sync --locked --extra dev --no-build-isolation --no-editable

      - name: Validate release with the development toolchain
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync mypy
          uv run --no-sync pytest
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"

      - name: Build distributions
        run: uv build --no-build-isolation

      - name: Publish through PyPI trusted publishing
        run: uv publish --trusted-publishing always
